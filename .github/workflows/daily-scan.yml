name: 港美股強勢股每日掃描

on:
  schedule:
    - cron: '30 9 * * 1-5'    # 港股 HKT 17:30 (UTC 09:30)
    - cron: '0 11 * * 1-5'    # 港股 HKT 19:00 backup
    - cron: '0 22 * * 1-5'    # 美股 HKT 06:00 隔日 (UTC 22:00 = ET 18:00 收市後)
    - cron: '0 2 * * 0'       # 港股週日 10:00 探索
  workflow_dispatch:
    inputs:
      market:
        description: '市場'
        required: false
        default: 'both'
        type: choice
        options: ['both', 'hk', 'us']
      mode:
        description: '運行模式'
        required: false
        default: 'fast'
        type: choice
        options: ['fast', 'explore', 'fetch_metadata', 'refresh_names']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取得 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判斷模式 + 市場
        id: setup
        run: |
          MODE="${{ inputs.mode }}"
          MARKET="${{ inputs.market }}"

          # 根據 schedule trigger 自動決定
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            SCHED="${{ github.event.schedule }}"
            if [[ "$SCHED" == "0 22 * * 1-5" ]]; then
              # 美股收市後
              MARKET="us"
              MODE="fast"
            elif [[ "$SCHED" == "0 2 * * 0" ]]; then
              # 港股週日探索
              MARKET="hk"
              MODE="explore"
            else
              # 港股平日
              MARKET="hk"
              MODE="fast"
            fi
          fi

          MODE="${MODE:-fast}"
          MARKET="${MARKET:-both}"
          echo "MODE=$MODE" >> $GITHUB_OUTPUT
          echo "MARKET=$MARKET" >> $GITHUB_OUTPUT
          echo "運行: market=$MARKET, mode=$MODE"

      # ====== HK Scanner ======
      - name: 港股掃描
        if: steps.setup.outputs.MARKET == 'hk' || steps.setup.outputs.MARKET == 'both'
        run: |
          cd scanner
          MODE="${{ steps.setup.outputs.MODE }}"
          if [[ "$MODE" == "explore" ]]; then
            python scanner.py --explore || true
          elif [[ "$MODE" == "fetch_metadata" ]]; then
            python fetch_metadata.py || true
            python scanner.py || true
          elif [[ "$MODE" == "refresh_names" ]]; then
            python refresh_names.py || true
            python scanner.py || true
          else
            python scanner.py || true
          fi

      # ====== US Scanner ======
      - name: 美股掃描
        if: steps.setup.outputs.MARKET == 'us' || steps.setup.outputs.MARKET == 'both'
        run: |
          cd scanner
          MODE="${{ steps.setup.outputs.MODE }}"
          if [[ "$MODE" == "explore" ]]; then
            # 美股 explore = rebuild universe
            python tickers_us.py
            python scanner_us.py || true
          else
            python scanner_us.py || true
          fi

      - name: 提交結果到 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/data.js site/data_us.json site/data_us.js \
                  site/history/ site/history_us/ \
                  site/streaks.json site/streaks_us.json \
                  scanner/universe_cache.json scanner/universe_cache_us.json \
                  scanner/metadata.json scanner/metadata_us.json \
                  scanner/names.json scanner/names_us.json \
                  scanner/universe_us.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "沒有數據變動，跳過 commit"
          else
            git commit -m "📈 ${MARKET:-both} 掃描更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上傳網頁到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
