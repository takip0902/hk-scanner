name: 港股強勢股每日掃描

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 平日 17:30 HKT - 快速模式
    - cron: '0 2 * * 0'      # 週日 10:00 HKT - 探索模式
  workflow_dispatch:
    inputs:
      mode:
        description: '運行模式'
        required: false
        default: 'fast'
        type: choice
        options:
          - fast              # 快速模式（用 cache + 邊緣探索）
          - explore           # 探索模式（重建 universe）
          - fetch_metadata    # 一次過 fetch 全部股票名稱+市值（10-15 分鐘）
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - '.github/workflows/daily-scan.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取得 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判斷模式
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 2 * * 0" ]]; then
            MODE="explore"
          elif [[ -z "$MODE" ]]; then
            MODE="fast"
          fi
          echo "MODE=$MODE" >> $GITHUB_OUTPUT
          echo "運行模式: $MODE"

      - name: 一次過 fetch metadata（如選 fetch_metadata 模式）
        if: steps.mode.outputs.MODE == 'fetch_metadata'
        run: |
          cd scanner
          python fetch_metadata.py

      - name: 執行掃描
        if: steps.mode.outputs.MODE != 'fetch_metadata'
        run: |
          cd scanner
          if [[ "${{ steps.mode.outputs.MODE }}" == "explore" ]]; then
            python scanner.py --explore
          else
            python scanner.py
          fi

      - name: 跑掃描以套用新 metadata（fetch_metadata 模式之後）
        if: steps.mode.outputs.MODE == 'fetch_metadata'
        run: |
          cd scanner
          python scanner.py

      - name: 提交結果到 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/data.js site/history/ site/streaks.json scanner/universe_cache.json scanner/metadata.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "沒有數據變動，跳過 commit"
          else
            git commit -m "📈 每日掃描更新 $(date -u +%Y-%m-%d) [${{ steps.mode.outputs.MODE }}]"
            git push
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上傳網頁到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
